# Site settings. Change the text values here; nothing else needs editing.
title: Clinical Rhythm
tagline: Semester 2 coursework resources
description: >-
  Lecture slides, textbook chapters, guidelines and journal articles for the
  Semester 2 modules: principles, malaria, tuberculosis and HIV, plus the test bank.
lang: en

# Where the site lives. Leave baseurl empty for a username.github.io site.
url: "https://clinicalrythm.github.io"
baseurl: ""
repo_url: "https://github.com/clinicalrythm/clinicalrythm.github.io"

# Keep the site out of search engines (students get the link from you).
# Set to true if you want Google to index it.
search_engines: false

# Files that should never be published to the site.
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .gitignore
